[project]
name = "evidence-engine-api"
version = "0.1.0"
description = "Deterministic evidence runtime for the Evidence Engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "mcp[cli]>=2.1.1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.mypy]
strict = true
packages = ["app"]
